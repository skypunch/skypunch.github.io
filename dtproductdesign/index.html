  {
    id: "1.6", title: "CAD/CAM & Production Systems",
    cards: [
      { q: "What is Computer-Aided Design (CAD)?", a: "The use of computers to design products on a screen. CAD can produce 2D and 3D drawings, render photorealistic images, rotate and zoom views, test designs for stress and strain, and send designs directly to CAM machines." },
      { q: "What are the advantages of CAD over traditional drawing methods?", a: "• Draw in 2D and 3D and change a design quickly\n• View a drawing from different angles by rotating and zooming\n• Render drawings to look photorealistic\n• Send designs directly to CAM machines\n• Test designs through software before manufacture\n• Manage production schedules and quality control" },
      { q: "What is Computer-Aided Manufacture (CAM)?", a: "The use of computers to automate the manufacture of products and to control production processes. A 2D or 3D CAD drawing is converted into co-ordinates which the CAM machine follows to complete its operation." },
      { q: "What is Computer-Integrated Manufacturing (CIM)?", a: "A method of production in which design, manufacture and management are linked electronically and controlled by computers. Computers monitor manufacturing, stock control, quality and output." },
      { q: "What is a Vinyl Cutter and what does it do?", a: "A CAM machine where plastic sheet with adhesive backing is fed in and out using rollers while the tool head moves left and right. A blade cuts 2D shapes from the vinyl." },
      { q: "What is a Laser Cutter and what materials can it cut?", a: "A CAM machine that uses a laser beam to cut 2D shapes. It can cut leather, laser plywood, paper, card, acrylic, fabric and many more. It can also etch into materials at various depths." },
      { q: "What is a 3D Printer and how does it work?", a: "A CAM machine used to create rapid prototypes and working components. The most common type uses additive manufacturing, where a material is extruded through a nozzle and the component is built up slowly in layers." },
      { q: "What are CNC Routers and Millers?", a: "Industrial CAM machines where a tool head cuts out, cuts slots and performs many other operations on materials such as aluminium, steel, hardwoods and manmade boards. CNC stands for Computer Numerical Control. They work from X, Y and Z co-ordinates." },
      { q: "What is Rapid Prototyping?", a: "The use of CAM to quickly produce models or parts for testing and modelling. 3D CAD files are typically converted to a stereo lithography file (.stl) and sent to a 3D printer." },
      { q: "What is Flexible Manufacturing Systems (FMS)?", a: "Manufacturing systems that produce products and goods using robots and computer-controlled tools and machines, without human intervention. The products can be changed easily by using a different program." },
      { q: "What is One-off (Job/Bespoke) Production?", a: "A production system where only one product is made at a time. It is highly skilled and labour intensive. Products are of individual high quality. Usually expensive." },
      { q: "What is Batch Production?", a: "A production system where small quantities of the same product are made. It can be labour intensive but uses machines, automation, jigs, moulds and formers to aid repetitive tasks. The cost per item is reduced." },
      { q: "What is Mass Production?", a: "A production system where hundreds or thousands of the same product are manufactured. The process is often automated with fewer workers. Very expensive to set up. Requires lots of quality control checks." },
      { q: "What is Continuous Production?", a: "Similar to mass production but production never stops - often running 24 hours a day with people working in shifts. Used for products like fuels, oils, plastics and lubricants from crude oil." },
      { q: "What is Quality Control (QC)?", a: "The process of maintaining standards in manufactured products. QC checks ensure all products meet the required standards - for example, checking print colours or checking dimensions of a component." },
      { q: "What is an Open-Loop Control System?", a: "The most basic systems diagram with three stages:\n• Input - the signal that starts the system\n• Operation (or control) - the 'brain' that takes an input and sends a message to the output\n• Output - a response to the information from the process\n\nThe output does not feed back to control the input." },
      { q: "What is a Closed-Loop Control System?", a: "A system that adds a Feedback link to the open-loop system. The feedback link closes the loop and sends signals from the OUTPUT back to the INPUT. This allows the system to control itself. ABS brakes are a good example." },
      { q: "What is RFID and how is it used in manufacturing?", a: "Radio-Frequency Identification - wireless non-contact devices that use electromagnetic fields to transfer data for automatically identifying and tracking tags attached to objects. Used heavily in manufacturing and distribution." },
    ]
  },
  {
    id: "1.7", title: "Design Roles & Human Factors",
    cards: [
      { q: "What is the role of a Designer?", a: "Designers play an important part in creating products, solving problems and coming up with solutions. They take a design brief from a client, carry out research, write a specification and generate innovative ideas. They have social, environmental and economic responsibilities." },
      { q: "What is an Artisan?", a: "A highly skilled person who generally produces bespoke or small numbers of high quality products or items. Examples include furniture makers and jewellery designers." },
      { q: "What is the role of a Technologist in design?", a: "A technologist supports engineers and designers with creative solutions to technical aspects of a design, such as electronic circuitry or mechanical systems." },
      { q: "What social considerations must a designer think about?", a: "• Avoiding exploitation of workers and traders\n• Sourcing materials local to the manufacturing area\n• Making sure working conditions are safe and of a reasonable standard\n• Using Fairtrade principles" },
      { q: "What environmental considerations must a designer think about?", a: "• Selecting materials from sustainable sources\n• Making sure manufacturing processes do not cause pollution or toxicity\n• Making efficient use of energy during manufacturing, distribution and use\n• Making sure products can be recycled and/or reused" },
      { q: "What economic considerations must a designer think about?", a: "• Creating jobs\n• Making sure profits are shared fairly (is anyone being exploited?)\n• Making sure production creates and maintains skills" },
      { q: "What is Life Cycle Analysis?", a: "An analysis of each part of the product's life and journey, from creation to the end of the product's life. Designers use it to consider what happens to a product when it is broken and not needed anymore." },
      { q: "What is 'Cradle to Cradle' thinking?", a: "A design philosophy that describes the whole life of a product from raw materials to end of life and recycling. It ensures the whole process of designing, making and what happens to the product when it is finished are all considered carefully, so nothing is wasted." },
      { q: "What is Ergonomics?", a: "The study of the way products can be designed so that they produce the best experience for users - how end users interact with products and systems, such as how they hold them, wear them, or use specific features. Also known as human factors." },
      { q: "What is Anthropometrics?", a: "The study of human sizes and measurements and how they relate to products. Scientists have measured thousands of people to produce mathematical data sets used by designers. Designers design for the 5th to 95th percentile." },
      { q: "What does designing for the 5th to 95th percentile mean?", a: "Anthropometric data follows a bell curve. The 50th percentile is the average. Designers design between the 5th and 95th percentile to meet most people's needs, excluding only the very smallest and very largest 5% at each end." },
      { q: "What is Planned Obsolescence?", a: "The deliberate creation of a product with a limited life. Manufacturers intentionally design the product to become obsolete after a certain period through software upgrades, material failure, component failure or compatibility issues." },
      { q: "What is Inclusive Design?", a: "Where everyday products and services are designed to be accessible to, and usable by, as many people as possible. Contrasts with exclusive design, where products are designed for a specific user group." },
    ]
  },
  {
    id: "1.8", title: "Aesthetics & Design Movements",
    cards: [
      { q: "What is Biomimicry in design?", a: "Using structures, shapes and forms found in nature to create innovative design solutions. Examples: Velcro inspired by plant seeds, the Mercedes 'Bionic' car inspired by aquatic life, the Gherkin building inspired by a flower bud." },
      { q: "What is Form and Function in design ideas?", a: "Form is the physical shape and appearance of something. Function is the job that a product is designed to do. Starting points include organic shapes, geometry, nature, cultural inspiration and biomimicry." },
      { q: "What is the Primary Function of a product?", a: "The main purpose of what a product is designed to do. For example, the primary function of a business card is to give information about a person professionally." },
      { q: "What is the Secondary Function of a product?", a: "A function that a product has in addition to its main function. Secondary functions often relate to cleaning, maintenance, styling and storage." },
      { q: "What does 'Form Follows Function' mean?", a: "A quote attributed to modernist architect Louis Sullivan. When designing a product or building, what it is intended to do should be considered first, and what it will look like should be considered second." },
      { q: "What is Aesthetics in product design?", a: "Concerned with the visual quality of an item or design - what makes it beautiful. Elements include: shape, form, proportion, balance, symmetry, pattern, colour and texture." },
      { q: "How is Colour used in product design?", a: "Colour can be used for function and aesthetics. Examples: green for go and red for stop. Warm/cool colours, bold colours, tints, shades and natural colours can all have dramatic effects on styling." },

// ═══════════════════════════════════════
// STATE
// ═══════════════════════════════════════

let state = {
  // Quiz
  questions: [],
  currentIndex: 0,
  score: 0,
  results: [],
  selectedAnswer: null,
  hasAnswered: false,
  totalQuestions: 10,
  shuffledAnswers: [],

  // Flashcard
  currentTopic: null,
  fcIndex: 0,
};

// ═══════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════

function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
  if (name === 'flashcard-topics') renderTopicList();
}

function mainMenu() {
  showScreen('menu');
}

// ═══════════════════════════════════════
// QUIZ LOGIC
// ═══════════════════════════════════════

document.getElementById('bank-count').textContent = quizQuestions.length + ' questions in the bank';

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startQuiz(count) {
  state.totalQuestions = count;
  state.questions = shuffle(quizQuestions).slice(0, count);
  state.currentIndex = 0;
  state.score = 0;
  state.results = [];
  state.selectedAnswer = null;
  state.hasAnswered = false;
  loadShuffledAnswers();
  showScreen('quiz');
  renderQuestion();
}

function loadShuffledAnswers() {
  const q = state.questions[state.currentIndex];
  state.shuffledAnswers = shuffle([q.correctAnswer, ...q.wrongAnswers]);
}

function renderQuestion() {
  const q = state.questions[state.currentIndex];

  // Update header
  document.getElementById('q-progress').textContent =
    `Question ${state.currentIndex + 1} of ${state.totalQuestions}`;
  const answered = state.results.length;
  document.getElementById('q-score').textContent =
    `Score: ${state.score}/${answered}`;
  const pct = (state.currentIndex / state.totalQuestions) * 100;
  document.getElementById('q-progress-bar').style.width = pct + '%';

  // Build question HTML
  const answersHtml = state.shuffledAnswers.map((ans, idx) => {
    let cls = 'answer-btn';
    let icon = '';
    if (state.hasAnswered) {
      if (ans === q.correctAnswer) { cls += ' correct'; icon = '<span class="answer-icon">✅</span>'; }
      else if (ans === state.selectedAnswer) { cls += ' wrong'; icon = '<span class="answer-icon">❌</span>'; }
    } else if (ans === state.selectedAnswer) {
      cls += ' selected';
    }
    const disabled = state.hasAnswered ? 'disabled' : '';
    return `<button class="${cls}" ${disabled} onclick="selectAnswer(${idx})">
      <span>${escHtml(ans)}</span>${icon}
    </button>`;
  }).join('');

  let feedbackHtml = '';
  if (state.hasAnswered) {
    const correct = state.selectedAnswer === q.correctAnswer;
    feedbackHtml = `<div class="feedback ${correct ? 'correct' : 'wrong'}">
      <div class="fb-icon">${correct ? '✅' : '❌'}</div>
      <div class="fb-text">
        <strong class="${correct ? 'c' : 'w'}">${correct ? 'Correct!' : 'Incorrect'}</strong>
        ${!correct ? `<p>The correct answer is:<br><span class="correct-ans">${escHtml(q.correctAnswer)}</span></p>` : ''}
      </div>
    </div>`;
  }

  document.getElementById('quiz-body').innerHTML = `
    <div class="question-text">${escHtml(q.question)}</div>
    <div class="answers">${answersHtml}</div>
    ${feedbackHtml}
  `;

  // Next button
  const nextWrap = document.getElementById('next-wrap');
  if (state.hasAnswered) {
    nextWrap.style.display = 'block';
    const isLast = state.currentIndex + 1 >= state.totalQuestions;
    document.getElementById('next-btn').textContent = isLast ? 'See Results' : 'Next Question';
  } else {
    nextWrap.style.display = 'none';
  }
}

function selectAnswer(idx) {
  if (state.hasAnswered) return;
  const answer = state.shuffledAnswers[idx];
  const q = state.questions[state.currentIndex];
  state.selectedAnswer = answer;
  state.hasAnswered = true;

  const isCorrect = answer === q.correctAnswer;
  if (isCorrect) state.score++;

  state.results.push({
    question: q.question,
    correctAnswer: q.correctAnswer,
    selectedAnswer: answer,
    wasCorrect: isCorrect,
  });

  // Bounce score
  const scoreEl = document.getElementById('q-score');
  if (isCorrect) {
    scoreEl.classList.add('bounce');
    setTimeout(() => scoreEl.classList.remove('bounce'), 400);
  }

  renderQuestion();
}

function nextQuestion() {
  const isLast = state.currentIndex + 1 >= state.totalQuestions;
  if (isLast) {
    showResults();
    return;
  }
  state.currentIndex++;
  state.selectedAnswer = null;
  state.hasAnswered = false;
  loadShuffledAnswers();
  renderQuestion();
}

function showResults() {
  showScreen('results');
  const pct = Math.round((state.score / state.totalQuestions) * 100);

  // Icon & grade
  let icon, grade, color;
  if (pct === 100) { icon = '⭐'; grade = 'PERFECT SCORE!'; color = 'var(--green)'; }
  else if (pct >= 90) { icon = '⭐'; grade = 'Outstanding!'; color = 'var(--green)'; }
  else if (pct >= 75) { icon = '👍'; grade = 'Great work!'; color = 'var(--green)'; }
  else if (pct >= 60) { icon = '😊'; grade = 'Good effort!'; color = 'var(--green)'; }
  else if (pct >= 40) { icon = '📖'; grade = 'Keep practising!'; color = 'var(--orange)'; }
  else { icon = '✏️'; grade = 'More revision needed!'; color = 'var(--red)'; }

  document.getElementById('res-icon').textContent = icon;
  document.getElementById('res-grade').textContent = grade;
  document.getElementById('res-grade').style.color = color;
  document.getElementById('res-pct').style.color = color;
  document.getElementById('res-score-text').textContent =
    `You scored ${state.score} out of ${state.totalQuestions}`;

  // Animate percentage
  animatePct(pct);

  // Result rows
  const rowsEl = document.getElementById('result-rows');
  rowsEl.innerHTML = state.results.map((r, i) => `
    <div class="result-row ${r.wasCorrect ? 'rr-correct' : 'rr-wrong'}" onclick="toggleRow(${i})">
      <div class="rr-header">
        <span class="rr-icon">${r.wasCorrect ? '✅' : '❌'}</span>
        <span class="rr-num">Q${i + 1}</span>
        <span class="rr-q">${escHtml(r.question)}</span>
        <span class="rr-chevron">▾</span>
      </div>
      <div class="rr-detail">
        ${!r.wasCorrect ? `<div class="det-row"><span class="det-label">Your answer:</span><span class="det-wrong">${escHtml(r.selectedAnswer)}</span></div>` : ''}
        <div class="det-row"><span class="det-label">Correct answer:</span><span class="det-correct">${escHtml(r.correctAnswer)}</span></div>
      </div>
    </div>
  `).join('');
}

function animatePct(target) {
  const el = document.getElementById('res-pct');
  const steps = Math.min(target, 30);
  if (steps === 0) { el.textContent = '0%'; return; }
  const interval = 600 / steps;
  let step = 0;
  const timer = setInterval(() => {
    step++;
    el.textContent = Math.round(target * step / steps) + '%';
    if (step >= steps) clearInterval(timer);
  }, interval);
}

function toggleRow(i) {
  const rows = document.querySelectorAll('.result-row');
  rows[i].classList.toggle('expanded');
}

// ═══════════════════════════════════════
// FLASHCARDS
// ═══════════════════════════════════════

function renderTopicList() {
  const list = document.getElementById('topic-list');
  list.innerHTML = flashcardTopics.map((t, i) => `
    <button class="topic-item" style="animation-delay:${i * 0.05}s" onclick="openTopic(${i})">
      <span class="tid">${escHtml(t.id)}</span>
      <span class="ttitle">${escHtml(t.title)}</span>
      <span class="tcount">${t.cards.length} cards</span>
      <span class="tchev">›</span>
    </button>
  `).join('');
}

function openTopic(index) {
  state.currentTopic = flashcardTopics[index];
  state.fcIndex = 0;
  showScreen('flashcard-view');
  document.getElementById('fc-topic-title').textContent =
    state.currentTopic.id + ' ' + state.currentTopic.title;
  document.getElementById('flashcard').classList.remove('flipped');
  renderCard();
}

function renderCard() {
  const topic = state.currentTopic;
  const card = topic.cards[state.fcIndex];
  const total = topic.cards.length;

  document.getElementById('fc-counter').textContent = `${state.fcIndex + 1} / ${total}`;
  document.getElementById('fc-progress-bar').style.width = ((state.fcIndex + 1) / total * 100) + '%';

  const qEl = document.getElementById('fc-question');
  const aEl = document.getElementById('fc-answer');

  qEl.innerHTML = `<p>${escHtml(card.q)}</p>`;
  const hasBullets = card.a.includes('•') || card.a.includes('- ');
  aEl.className = 'card-text' + (hasBullets ? ' bullet' : '');
  aEl.innerHTML = `<p>${escHtml(card.a).replace(/\n/g, '<br>')}</p>`;

  document.getElementById('fc-prev').disabled = state.fcIndex === 0;
  document.getElementById('fc-next').disabled = state.fcIndex >= total - 1;
}

function flipCard() {
  document.getElementById('flashcard').classList.toggle('flipped');
}

function fcNavigate(dir) {
  const newIndex = state.fcIndex + dir;
  if (newIndex < 0 || newIndex >= state.currentTopic.cards.length) return;
  document.getElementById('flashcard').classList.remove('flipped');
  setTimeout(() => {
    state.fcIndex = newIndex;
    renderCard();
  }, 150);
}

// ═══════════════════════════════════════
// UTILITIES
// ═══════════════════════════════════════

function escHtml(str) {
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}
</script>
